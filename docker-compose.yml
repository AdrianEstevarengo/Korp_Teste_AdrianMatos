services:
  postgres:
    image: postgres:16-alpine
    container_name: korp-postgres
    environment:
      POSTGRES_USER: korp
      POSTGRES_PASSWORD: korp123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korp"]
      interval: 5s
      timeout: 5s
      retries: 10

  estoque-service:
    build:
      context: ./backend/EstoqueService
    container_name: korp-estoque
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=db_estoque;Username=korp;Password=korp123"
      # Deixe a chave vazia para usar o gerador de IA em modo simulado (offline).
      # Preencha com uma chave OpenAI para usar IA real.
      Ia__ApiKey: ""
      Ia__Model: "gpt-4o-mini"
    ports:
      - "5001:8080"

  faturamento-service:
    build:
      context: ./backend/FaturamentoService
    container_name: korp-faturamento
    depends_on:
      postgres:
        condition: service_healthy
      estoque-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=db_faturamento;Username=korp;Password=korp123"
      Servicos__EstoqueBaseUrl: "http://estoque-service:8080"
    ports:
      - "5002:8080"

  frontend:
    build:
      context: ./frontend
    container_name: korp-frontend
    depends_on:
      - estoque-service
      - faturamento-service
    ports:
      - "4200:80"

volumes:
  pgdata:
